name: rindexer
project_type: rust

global:
  # rindexer's built-in health server only checks that the DB is reachable and
  # tables exist, so it reports healthy while indexing is stalled. The app serves
  # its own progress-aware /health on HEALTH_PORT (default 3000) instead.
  health_port: 3001

storage:
  postgres:
    enabled: true
    disable_create_tables: true
native_transfers:
  enabled: false

networks:
  - name: ethereum
    chain_id: 1
    rpc: ${ETHEREUM_NODE_URL}
    max_block_range: 50
    block_poll_frequency: 120000
    compute_units_per_second: 300

  - name: arbitrum
    chain_id: 42161
    rpc: ${ARBITRUM_NODE_URL}
    max_block_range: 100
    # Dependency-ordered contracts fetch live logs from the last seen block to
    # the head in one eth_getLogs call, without applying max_block_range. Poll
    # often enough that the range stays under the RPC's 100-block cap
    # (~60 Arbitrum blocks per 15s).
    block_poll_frequency: 15000
    compute_units_per_second: 500

contracts:
  - name: ARBToken
    details:
      - network: arbitrum
        address: 0x912ce59144191c1204e64559fe8253a0e49e6548
        start_block: "70398215"
    abi: ./abis/ARBToken.abi.json
    include_events:
      - DelegateVotesChanged
      - DelegateChanged
    reorg_safe_distance: true
    index_event_in_order:
      - DelegateVotesChanged
      - DelegateChanged

  - name: ArbitrumCoreGovernor
    details:
      - network: arbitrum
        address: 0xf07ded9dc292157749b6fd268e37df6ea38395b9
        start_block: "70398215"
    abi: ./abis/ArbitrumCoreGovernor.abi.json
    include_events:
      - ProposalCreated
      - VoteCast
      - ProposalExtended
      - ProposalExecuted
    reorg_safe_distance: true
    index_event_in_order:
      - ProposalCreated
      - VoteCast
      - ProposalExtended
      - ProposalExecuted
    dependency_events:
      events:
        - ProposalCreated
      then:
        events:
          - ProposalExtended
        then:
          events:
            - VoteCast
          then:
            events:
              - ProposalExecuted

  - name: ArbitrumTreasuryGovernor
    details:
      - network: arbitrum
        address: 0x789fc99093b09ad01c34dc7251d0c89ce743e5a4
        start_block: "70398215"
    abi: ./abis/ArbitrumTreasuryGovernor.abi.json
    include_events:
      - ProposalCreated
      - VoteCast
      - ProposalExtended
      - ProposalExecuted
    reorg_safe_distance: true
    index_event_in_order:
      - ProposalCreated
      - VoteCast
      - ProposalExtended
      - ProposalExecuted
    dependency_events:
      events:
        - ProposalCreated
      then:
        events:
          - ProposalExtended
        then:
          events:
            - VoteCast
          then:
            events:
              - ProposalExecuted

  - name: ArbitrumSCNominations
    details:
      - network: arbitrum
        address: 0x8a1cda8dee421cd06023470608605934c16a05a0
        start_block: "121763102"
    abi: ./abis/ArbitrumSCNominations.abi.json
    include_events:
      - ProposalCreated
      - ProposalExecuted
    reorg_safe_distance: true
    index_event_in_order:
      - ProposalCreated
      - ProposalExecuted
    dependency_events:
      events:
        - ProposalCreated
      then:
        events:
          - ProposalExecuted

  - name: UNIToken
