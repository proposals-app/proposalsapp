[workspace]
members = ["apps/discourse", "apps/rindexer", "libs/rust/db", "libs/rust/utils"]

resolver = "2"

[workspace.dependencies]
alloy = { version = "2.1.1", features = ["full"] }
alloy-ens = { version = "2.1.1", features = ["contract", "provider"] }
anyhow = "1.0.104"
async-trait = "0.1.91"
axum = "0.8.9"
backtrace = "0.3.76"
bincode = "3.0.0"
chrono = "0.4.45"
csv = "1.4.0"
dotenv = "0.15.0"
fancy-regex = "0.18.0"
fastembed = "5.17.3"
futures = "0.3.33"
gag = "1.0"
html-escape = "0.2.14"
indicatif = "0.18.6"
lazy_static = "1.5.0"
llm_client = "0.0.7"
llm_models = "0.0.3"
mockito = "1.7"
once_cell = "1.21.4"
oneshot = "0.2.1"
proposalsapp-db = { path = "libs/rust/db" }
proptest = "1.11"
rand = "0.10.2"
redis = { version = "1.4.1", features = ["tokio-comp", "connection-manager"] }
regex = "1.13.1"
reqwest = { version = "0.13.4", default-features = false }
reqwest-middleware = "0.5.2"
reqwest-retry = "0.9.1"
rindexer = { git = "https://github.com/joshstevens19/rindexer", rev = "32d7fc24df85168702c4623c79fd5a45a4f7952e", package = "rindexer" }
rustls = "0.23.42"
scraper = "0.27.0"
sea-orm = { version = "1.1.20", default-features = false }
serde = "1.0.229"
serde_json = "1.0.151"
serde_yaml = "0.9.34"
serial_test = "3.5.0"
testcontainers = "0.27.3"
thiserror = "2.0.19"
tokio = "1.53.1"
tokio-retry = "0.3.2"
tracing = "0.1.44"
tracing-subscriber = "0.3.23"
utils = { path = "libs/rust/utils" }
uuid = "1.24"

[profile.release]
opt-level = 3
codegen-units = 1
lto = true
debug = true
debug-assertions = true
rpath = false
